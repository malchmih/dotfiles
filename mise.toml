# Native core package selections; "latest" is a request, not a version pin.
[bootstrap.packages]
# mise's built-in Homebrew backend supports these Apple Silicon/Linux targets.
"brew:gh" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"brew:topgrade" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"brew:ripgrep" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"brew:httpie" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"brew:fzf" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"brew:zsh-autosuggestions" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"brew:zsh-syntax-highlighting" = { version = "latest", os = ["macos/arm64", "linux/x64", "linux/arm64"] }
"brew:zsh" = { version = "latest", os = "macos/arm64" }
"brew:git" = { version = "latest", os = "macos/arm64" }
"brew:vim" = { version = "latest", os = "macos/arm64" }

# Linux keeps the existing APT ownership for foundational shell/editor tools.
"apt:zsh" = { version = "latest", os = ["linux/x64", "linux/arm64"] }
"apt:git" = { version = "latest", os = ["linux/x64", "linux/arm64"] }
"apt:vim" = { version = "latest", os = ["linux/x64", "linux/arm64"] }

# Optional runtime used only by explicit repository tasks.
[tools]
python = "latest"

# Invoke explicitly before native package bootstrap; keep installer prompts intact.
[tasks.install-homebrew]
description = "Install Homebrew using its official installer"
raw = true
run = '''
set -eu

if command -v brew >/dev/null 2>&1; then
    brew --version
    exit 0
fi

installer="$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
/bin/bash -c "$installer"
'''

# Invoke explicitly with `mise run check`; recovery and shell startup never run it.
[tasks.check]
description = "Check shared Zsh syntax and shell regressions"
run = '''
set -eu

for executable in zsh python; do
    if ! command -v "$executable" >/dev/null 2>&1; then
        printf 'mise check: required command not found: %s\n' "$executable" >&2
        exit 1
    fi
done

printf '%s\n' 'Checking Zsh syntax...'
for startup in zshenv zprofile zshrc; do
    zsh -nf "$startup"
done

printf '%s\n' 'Running isolated shell regression tests...'
PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
'''

# Model choices remain local; ordinary bootstrap and dot apply never run this.
[tasks.sync-secondary-model]
description = "Sync the local secondary model pair to OpenCode and Implement Loop"
run = "python scripts/sync-secondary-model.py"

# A process ZSH override keeps the checkout aligned with the shell preference.
[vars]
ZSH = { default = "~/.oh-my-zsh" }

[bootstrap.repos]
"{{ vars.ZSH }}" = { url = "https://github.com/ohmyzsh/ohmyzsh.git", depth = 1 }

# No development task is part of bootstrap, and no shell edits happen here.
# Shared configuration sources are relative to this repository-root file.
[dotfiles]
"~/.vimrc" = { source = "vimrc", mode = "symlink" }
"~/.ideavimrc" = { source = "ideavimrc", mode = "symlink" }
"~/.zshrc" = { source = "zshrc", mode = "symlink" }
"~/.zshenv" = { source = "zshenv", mode = "symlink" }
"~/.zprofile" = { source = "zprofile", mode = "symlink" }
# mise resolves xdg_config_home from XDG_CONFIG_HOME, falling back to ~/.config
# when it is unset or empty.
[dotfiles."opencode/AGENTS.md"]
source = "opencode/AGENTS.md"
mode = "symlink"
variants = [{ default = true, target = "{{ xdg_config_home }}/opencode/AGENTS.md" }]

[dotfiles."opencode/cli.json"]
source = "opencode/cli.json"
mode = "symlink"
variants = [{ default = true, target = "{{ xdg_config_home }}/opencode/cli.json" }]
