- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.vimrc: vimrc
    ~/.ideavimrc: ideavimrc
    ~/.zshrc: zshrc
    ~/.zshenv: zshenv
    ~/.zprofile: zprofile
    ~/.local/bin/update-tools:
      path: update-tools
      create: true
    ~/.local/bin/update-system:
      path: update-system
      create: true
    ~/.local/bin/up:
      path: up
      create: true
    ~/.local/bin/cleanup:
      path: cleanup
      create: true
    ${XDG_CONFIG_HOME}/opencode/AGENTS.md:
      path: opencode/AGENTS.md
      create: true
    ${XDG_CONFIG_HOME}/opencode/cli.json:
      path: opencode/cli.json
      create: true
